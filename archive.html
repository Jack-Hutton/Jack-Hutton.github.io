<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>归档 - 李甫西大夫</title>
    <style>
        body { 
            background-color: #0f172a; 
            color: white; 
            font-family: sans-serif; 
            padding: 40px; 
            max-width: 800px; 
            margin: 0 auto; 
        }
        h1 { 
            color: #38bdf8; 
            text-shadow: 0 0 20px #38bdf8; 
            text-align: center;
            border-bottom: 2px solid #38bdf8;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        /* 文章卡片样式 */
        .article-card { 
            background-color: #1e293b; 
            margin-bottom: 20px; 
            padding: 20px; 
            border-radius: 8px; 
            border-left: 5px solid #ff007c;
            transition: 0.3s;
            text-align: left;
        }
        .article-card:hover {
            transform: translateX(10px);
            box-shadow: 0 0 15px rgba(255, 0, 124, 0.3);
        }
        .article-title {
            color: #00ff00;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .article-content {
            color: #cbd5e1;
            line-height: 1.6;
            font-size: 16px;
        }
        .btn { 
            display: block; 
            width: 200px; 
            text-align: center; 
            padding: 12px 24px; 
            background-color: #ff007c; 
            color: white; 
            border-radius: 8px; 
            font-weight: bold; 
            margin: 40px auto 0; 
            text-decoration: none;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
    </style>
</head>
<body>
    <h1>📚 个人归档</h1>

    <div class="article-card">
        <div class="article-title">一、我的个人博客</div>
        <div class="article-content">
            这是我历经千辛万苦彻夜难眠绞尽脑汁设计的博客！
        </div>
    </div>

    <a href="index.html" class="btn">⬅ 返回主页</a>
</body>
</html>
