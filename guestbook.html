<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>留言板 - 李甫西大夫</title>
    <style>
        body { 
            background-color: #0f172a; 
            color: white; 
            text-align: center; 
            font-family: sans-serif; 
            padding: 40px 20px; 
        }
        h1 { color: #38bdf8; text-shadow: 0 0 20px #38bdf8; }
        p { font-size: 18px; margin-bottom: 30px; }
        /* 留言板区域加个白底黑字或深色底，避免和你的黑背景混在一起 */
        #comments { 
            max-width: 800px; 
            margin: 0 auto; 
            background-color: #1e293b; /* 深色背景 */
            padding: 20px; 
            border-radius: 10px; 
        }
        .btn { 
            display: inline-block; 
            padding: 12px 24px; 
            background-color: #ff007c; 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>李甫西大夫的留言板</h1>
    <p>欢迎在这里留下你的足迹！（需要 GitHub 账号登录）</p>

    <!-- Utterances 需要一个容器，或者直接挂载在 body 上 -->
    <div id="comments"></div>

    <script src="https://utteranc.es/client.js"
        repo="Jack-Hutton/Jack-Hutton.github.io"
        issue-term="pathname"
        theme="github-dark"
        crossorigin="anonymous"
        async>
    </script>

    <a href="index.html" class="btn">⬅ 返回主页</a>
</body>
</html>
